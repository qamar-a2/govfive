<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إدارة بيانات المواطنين</title>

    <link rel="stylesheet"

    <link rel="stylesheet" href="global.css">

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#EFEBE3] font-sans">

    <div class="flex min-h-screen">

        <!-- القائمة الجانبية -->
        <div id="sidebar-wrapper" class="sticky top-0 h-screen"></div>


        <!-- المحتوى الرئيسي -->

            <!-- الهيدر -->
            <div id="header" class="sticky top-0 z-10"></div>


            <!-- محتوى الصفحة -->

                <div class="bg-white p-6 rounded-lg shadow">

                    <!-- عنوان الصفحة + زر الإضافة -->

                        <h2 class="text-xl font-bold text-gray-800">
                            قائمة المواطنين المسجلين
                        </h2>

                        <button
                            onclick="openAddModal()"
                            class="bg-[#042522] text-white px-4 py-2 rounded flex items-center gap-2 hover:bg-opacity-90 transition">

                            <i class="fas fa-user-plus"></i>

                            <span>
                                إضافة مواطن جديد
                            </span>

                        </button>

                    </div>


                    <!-- الجدول -->
                    <div class="overflow-x-auto">

                        <table class="w-full text-right border-collapse">

                            <thead>

                                <tr class="border-b text-gray-500 text-sm">

                                    <th class="pb-3">
                                        الرقم الوطني
                                    </th>

                                    <th class="pb-3">
                                        الاسم الكامل
                                    </th>

                                    <th class="pb-3">
                                        اسم الأم
                                    </th>

                                    <th class="pb-3">
                                        تاريخ الميلاد
                                    </th>

                                    <th class="pb-3">
                                        الجنس
                                    </th>

                                    <th class="pb-3">
                                        لديه حساب؟
                                    </th>

                                    <th class="pb-3 text-center">
                                        إجراءات
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="citizensTableBody">

                                <!-- البيانات تظهر هنا -->

                            </tbody>

                        </table>

                    </div>

                </div>

            </main>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- Modal تفاصيل المواطن -->
    <!-- ===================================================== -->

    <div
        id="viewCitizenModal"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">

        <div class="bg-white rounded-lg w-full max-w-2xl overflow-hidden shadow-xl">


            <!-- رأس النافذة -->
            <div class="bg-[#042522] text-white p-4 flex justify-between items-center">

                <h3 class="font-bold text-lg">

                    <i class="fas fa-id-card ml-2"></i>

                    تفاصيل بيانات المواطن

                </h3>


                <button
                    onclick="closeModal('viewCitizenModal')"
                    class="text-gray-300 hover:text-white text-xl">

                    &times;

                </button>

            </div>


            <!-- التفاصيل -->
            <div
                class="p-6 grid grid-cols-2 gap-4 text-sm text-gray-700"
                id="citizenDetailsContent">

                <!-- يتم تعبئة التفاصيل هنا -->

            </div>


            <!-- زر الإغلاق -->
            <div class="p-4 bg-gray-50 text-left border-t">

                <button
                    onclick="closeModal('viewCitizenModal')"
                    class="px-5 py-1.5 bg-gray-500 text-white rounded hover:bg-gray-600 transition">

                    إغلاق

                </button>

            </div>

        </div>

    </div>


    <!-- ===================================================== -->
    <!-- Modal إضافة مواطن -->
    <!-- ===================================================== -->

    <div
        id="addCitizenModal"
        class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">

        <div
            class="bg-white rounded-lg w-full max-w-3xl overflow-hidden shadow-xl max-h-[90vh] flex flex-col">


            <!-- رأس النافذة -->
            <div class="bg-[#042522] text-white p-4 flex justify-between items-center">

                <h3 class="font-bold text-lg">

                    <i class="fas fa-user-plus ml-2"></i>

                    إضافة سجل مواطن جديد

                </h3>


                <button
                    onclick="closeModal('addCitizenModal')"
                    class="text-gray-300 hover:text-white text-xl">

                    &times;

                </button>

            </div>


            <!-- الفورم -->
            <form
                id="addCitizenForm"
                onsubmit="submitCitizen(event)"
                class="p-6 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">


                <!-- الرقم الوطني -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        الرقم الوطني
                    </label>

                    <input
                        type="text"
                        name="nationalNumber"
                        required
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- الاسم الأول -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        الاسم الأول
                    </label>

                    <input
                        type="text"
                        name="firstName"
                        required
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- اسم الأب -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        اسم الأب
                    </label>

                    <input
                        type="text"
                        name="fatherName"
                        required
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- النسبة -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        النسبة (الكنية)
                    </label>

                    <input
                        type="text"
                        name="lastName"
                        required
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- اسم الأم -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        اسم الأم
                    </label>

                    <input
                        type="text"
                        name="motherName"
                        required
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- تاريخ الميلاد -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        تاريخ الميلاد
                    </label>

                    <input
                        type="date"
                        name="birthDate"
                        required
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- البريد الإلكتروني -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        name="email"
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- العنوان -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        العنوان
                    </label>

                    <input
                        type="text"
                        name="address"
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- مكان الميلاد -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        مكان الميلاد
                    </label>

                    <input
                        type="text"
                        name="placeOfBirth"
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- الجنس -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        الجنس
                    </label>

                    <select
                        name="gender"
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                        <option value="Male">
                            ذكر
                        </option>

                        <option value="Female">
                            أنثى
                        </option>

                    </select>

                </div>


                <!-- الحالة الاجتماعية -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        الحالة الاجتماعية
                    </label>

                    <input
                        type="text"
                        name="maritalStatus"
                        placeholder="أعزب/متزوج..."
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- الديانة -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        الديانة
                    </label>

                    <input
                        type="text"
                        name="religion"
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- مكان القيد -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        مكان القيد
                    </label>

                    <input
                        type="text"
                        name="recordPlace"
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- رقم القيد -->
                <div>

                    <label class="block font-medium mb-1 text-gray-700">
                        رقم القيد
                    </label>

                    <input
                        type="text"
                        name="recordNumber"
                        class="w-full p-2 border rounded focus:outline-none focus:border-[#042522]">

                </div>


                <!-- الأزرار -->
                <div
                    class="col-span-1 md:col-span-2 flex justify-end gap-3 mt-4 pt-4 border-t">

                    <button
                        type="button"
                        onclick="closeModal('addCitizenModal')"
                        class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">

                        إلغاء

                    </button>


                    <button
                        type="submit"
                        class="px-5 py-2 bg-[#042522] text-white rounded hover:bg-opacity-90">

                        حفظ المواطن

                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- JavaScript المشترك -->
    <script src="sidebar.js"></script>


    <script>

        // =====================================================
        // المتغيرات
        // =====================================================

        let allCitizens = [];

        const API_BASE_URL =
            'http://egovservices.runasp.net/api/Admin/citizens';


        // =====================================================
        // قراءة رسالة الخطأ
        // =====================================================

        async function getErrorMessage(response) {

            let text = '';

            try {

                text = await response.text();

            } catch (e) {

                return `فشل الطلب (كود ${response.status})`;

            }


            if (!text) {

                return `فشل الطلب (كود ${response.status})`;

            }


            try {

                const data = JSON.parse(text);


                if (data.errors) {

                    const fieldErrors =
                        Object.entries(data.errors)

                            .map(([field, msgs]) =>
                                `${field}: ${
                                    Array.isArray(msgs)
                                        ? msgs.join(', ')
                                        : msgs
                                }`
                            )

                            .join('\n');


                    if (fieldErrors) {

                        return fieldErrors;

                    }

                }


                return (
                    data.message ||
                    data.title ||
                    `فشل الطلب (كود ${response.status})`
                );

            } catch (e) {

                return text;

            }

        }


        // =====================================================
        // جلب المواطنين
        // =====================================================

       async function fetchAndDisplayCitizens(newNationalNumber = null) {

    try {

        const myHeaders = new Headers();

        myHeaders.append(
            "Authorization",
            `Bearer ${localStorage.getItem('userToken')}`
        );

        const response = await fetch(API_BASE_URL, {
            method: 'GET',
            headers: myHeaders
        });

        if (response.ok) {

            const result = await response.json();

            let citizens = (
                result &&
                Array.isArray(result.data)
            )
                ? result.data
                : [];

            // إذا في مواطن انضاف الآن، نحطه أول عنصر مهما كان ترتيب الـ API
            if (newNationalNumber) {

                const newCitizenIndex = citizens.findIndex(
                    citizen =>
                        String(citizen.nationalNumber) ===
                        String(newNationalNumber)
                );

                if (newCitizenIndex !== -1) {

                    const newCitizen =
                        citizens.splice(newCitizenIndex, 1)[0];

                    citizens.unshift(newCitizen);
                }
            }

            allCitizens = citizens;

            displayCitizens(allCitizens);

        } else {

            console.error(
                "فشل جلب قائمة المواطنين:",
                await getErrorMessage(response)
            );

            displayCitizens([]);

        }

    } catch (error) {

        console.error(
            "خطأ في الاتصال بالخادم:",
            error
        );

        displayCitizens([]);

    }
}

        // =====================================================
        // عرض المواطنين داخل الجدول
        // =====================================================

        function displayCitizens(citizensList) {

            const tbody =
                document.getElementById(
                    'citizensTableBody'
                );


            tbody.innerHTML = '';


            if (
                !citizensList ||
                citizensList.length === 0
            ) {

                tbody.innerHTML = `
                    <tr>

                        <td
                            colspan="7"
                            class="py-6 text-center text-gray-500">

                            لا يوجد مواطنون لعرضهم

                        </td>

                    </tr>
                `;

                return;

            }


            citizensList.forEach(citizen => {


                const hasAccountBadge =
                    citizen.hasAccount

                        ? `
                            <span
                                class="text-green-600 font-bold">

                                <i class="fas fa-check-circle"></i>

                                نعم

                            </span>
                          `

                        : `
                            <span class="text-gray-400">

                                <i class="fas fa-times-circle"></i>

                                لا

                            </span>
                          `;


                tbody.innerHTML += `

                    <tr class="border-b hover:bg-gray-50">

                        <td
                            class="py-4 font-mono text-sm font-bold text-gray-700">

                            ${citizen.nationalNumber || '---'}

                        </td>


                        <td class="py-4 font-medium">

                            ${citizen.fullName || '---'}

                        </td>


                        <td class="py-4 text-gray-600">

                            ${citizen.motherName || '---'}

                        </td>


                        <td class="py-4 text-gray-600">

                            ${citizen.birthDate || '---'}

                        </td>


                        <td class="py-4 text-gray-600">

                            ${citizen.gender || '---'}

                        </td>


                        <td class="py-4 text-center">

                            ${hasAccountBadge}

                        </td>


                        <td class="py-4 text-center">

                            <div
                                class="flex items-center justify-center gap-2">

                                <button
                                    onclick="fetchCitizenDetails('${citizen.nationalNumber}')"
                                    class="bg-[#042522] text-white px-3 py-1 rounded hover:bg-opacity-90 inline-block text-sm"
                                    title="تفاصيل">

                                    <i class="fas fa-eye"></i>

                                    التفاصيل

                                </button>

                            </div>

                        </td>

                    </tr>

                `;

            });

        }


        // =====================================================
        // جلب تفاصيل مواطن
        // =====================================================

        async function fetchCitizenDetails(nationalNumber) {

            try {

                const myHeaders = new Headers();


                const token =
                    localStorage.getItem('userToken');


                myHeaders.append(
                    "Authorization",
                    `Bearer ${token}`
                );


                const response = await fetch(
                    `${API_BASE_URL}/${nationalNumber}`,
                    {
                        method: 'GET',
                        headers: myHeaders
                    }
                );


                if (response.ok) {

                    const result =
                        await response.json();


                    const citizen =
                        (
                            result &&
                            result.data
                        )
                            ? result.data
                            : result;


                    const detailsContainer =
                        document.getElementById(
                            'citizenDetailsContent'
                        );


                    detailsContainer.innerHTML = `

                        <div>
                            <strong>الرقم الوطني:</strong>
                            ${citizen.nationalNumber || '---'}
                        </div>

                        <div>
                            <strong>الاسم الكامل:</strong>
                            ${citizen.fullName || '---'}
                        </div>

                        <div>
                            <strong>اسم الأم:</strong>
                            ${citizen.motherName || '---'}
                        </div>

                        <div>
                            <strong>تاريخ الميلاد:</strong>
                            ${citizen.birthDate || '---'}
                        </div>

                        <div>
                            <strong>مكان الميلاد:</strong>
                            ${citizen.placeOfBirth || '---'}
                        </div>

                        <div>
                            <strong>الجنس:</strong>
                            ${citizen.gender || '---'}
                        </div>

                        <div>
                            <strong>الحالة الاجتماعية:</strong>
                            ${citizen.maritalStatus || '---'}
                        </div>

                        <div>
                            <strong>الديانة:</strong>
                            ${citizen.religion || '---'}
                        </div>

                        <div>
                            <strong>مكان القيد:</strong>
                            ${citizen.recordPlace || '---'}
                        </div>

                        <div>
                            <strong>رقم القيد:</strong>
                            ${citizen.recordNumber || '---'}
                        </div>

                        <div>
                            <strong>لديه حساب:</strong>
                            ${citizen.hasAccount ? 'نعم' : 'لا'}
                        </div>

                    `;


                    openModal('viewCitizenModal');

                } else {

                    const errorMessage =
                        await getErrorMessage(response);


                    alert(
                        `عذراً، تعذر جلب تفاصيل بيانات المواطن.\n${errorMessage}`
                    );

                }

            } catch (error) {

                console.error(
                    "خطأ في جلب التفاصيل:",
                    error
                );


                alert(
                    'حدث خطأ في الاتصال بالسيرفر'
                );

            }

        }


        // =====================================================
        // إضافة مواطن جديد
        // =====================================================

        async function submitCitizen(event) {

            event.preventDefault();


            const formData =
                new FormData(event.target);


            const payload =
                Object.fromEntries(
                    formData.entries()
                );


            /*
             * مهم:
             * birthDate يبقى كما هو:
             *
             * YYYY-MM-DD
             *
             * لأن الـ Backend يستخدم System.DateOnly
             *
             * لذلك لا نستخدم:
             * new Date(...).toISOString()
             */


            console.log(
                "البيانات المرسلة:",
                JSON.stringify(payload, null, 2)
            );


            try {

                const myHeaders =
                    new Headers();


                const token =
                    localStorage.getItem('userToken');


                myHeaders.append(
                    "Authorization",
                    `Bearer ${token}`
                );


                myHeaders.append(
                    "Content-Type",
                    "application/json"
                );


                const response =
                    await fetch(
                        API_BASE_URL,
                        {
                            method: "POST",

                            headers: myHeaders,

                            body: JSON.stringify(payload)
                        }
                    );


                if (response.ok) {

                    alert(
                        "تمت إضافة المواطن بنجاح"
                    );


                    closeModal(
                        'addCitizenModal'
                    );


                    event.target.reset();


                    /*
                     * إعادة تحميل القائمة
                     * وبالتالي يظهر المواطن الجديد بالأول
                     */

                    await fetchAndDisplayCitizens();


                } else {

                    const errorMessage =
                        await getErrorMessage(
                            response
                        );


                    console.error(
                        "خطأ السيرفر:",
                        errorMessage
                    );


                    alert(
                        `فشلت الإضافة:\n\n${errorMessage}`
                    );

                }

            } catch (error) {

                console.error(
                    "خطأ في إرسال البيانات:",
                    error
                );


                alert(
                    "فشل الاتصال بالسيرفر"
                );

            }

        }


        // =====================================================
        // البحث
        // =====================================================

        function filterTable() {

            const searchInput =
                document.getElementById(
                    'searchInput'
                );


            if (!searchInput) {

                return;

            }


            const searchText =
                searchInput.value
                    .trim()
                    .toLowerCase();


            const filtered =
                allCitizens.filter(citizen => {

                    const natNum =
                        String(
                            citizen.nationalNumber || ''
                        ).toLowerCase();


                    const fullName =
                        (
                            citizen.fullName || ''
                        ).toLowerCase();


                    return (
                        natNum.includes(searchText) ||
                        fullName.includes(searchText)
                    );

                });


            displayCitizens(filtered);

        }


        // =====================================================
        // فتح وإغلاق النوافذ
        // =====================================================

        function openModal(id) {

            document
                .getElementById(id)
                .classList
                .remove('hidden');

        }


        function closeModal(id) {

            document
                .getElementById(id)
                .classList
                .add('hidden');

        }


        function openAddModal() {

            openModal(
                'addCitizenModal'
            );

        }


        // =====================================================
        // عند تحميل الصفحة
        // =====================================================

        document.addEventListener(
            'DOMContentLoaded',
            () => {

                if (
                    typeof loadsidebar === 'function'
                ) {

                    loadsidebar();

                }


                if (
                    typeof loadheader === 'function'
                ) {

                    loadheader();

                }


                fetchAndDisplayCitizens();


                setTimeout(() => {

                    const searchInput =
                        document.getElementById(
                            'searchInput'
                        );


                    if (searchInput) {

                        searchInput.addEventListener(
                            'input',
                            filterTable
                        );

                    }

                }, 500);

            }
        );

    </script>

</body>

</html>
