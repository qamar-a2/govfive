<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="global.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#EFEBE3] font-sans">
    <div class="flex h-screen">
        
      <div id="sidebar-wrapper"></div>

       
        <div class="flex-1 flex flex-col">
            <div id="header"></div>
            
            <main class="p-6">
                <div class="bg-white p-6 rounded-lg shadow">
                    <h2 class="text-xl font-bold mb-6">قائمة المستخدمين</h2>
                    <table class="w-full text-right">
                        <thead>
                            <tr class="border-b text-gray-500">
                                <th class="pb-3">الاسم الكامل</th>
                                <th class="pb-3">البريد الإلكتروني</th>
                                <th class="pb-3">الحالة</th>
                                <th class="pb-3">إجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="sidebar.js"></script>
    <script>
        // دالة جلب وعرض المستخدمين
        async function fetchAndDisplayUsers() {
            try {
                const response = await fetch('http://egovservices.runasp.net/api/Admin/users', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('userToken')}` }
                });
                const result = await response.json();
                const users = result.data.items || [];
                const tbody = document.getElementById('usersTableBody');
                
                tbody.innerHTML = '';
                users.forEach(user => {
                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="py-4">${user.fullName || '---'}</td>
                            <td class="py-4">${user.email || '---'}</td>
                            <td class="py-4">
                                <span class="${user.isActive ? 'text-green-600' : 'text-red-600'} font-bold">
                                    ${user.isActive ? 'فعال' : 'غير فعال'}
                                </span>
                            </td>
                            <td class="py-4">
                                <button onclick="toggleUser('${user.id}')" class="bg-[#042522] text-white px-4 py-1 rounded hover:bg-opacity-90">
                                    تبديل الحالة
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("خطأ:", error);
            }
        }

        // دالة التبديل
        async function toggleUser(userId) {
            const response = await fetch(`http://egovservices.runasp.net/api/Admin/users/${userId}/toggle`, {
                method: 'PATCH',
                headers: { 'Authorization': `Bearer ${localStorage.getItem('userToken')}` }
            });
            if (response.ok) {
                fetchAndDisplayUsers();
            }
        }
// دالة تبديل الحالة
async function toggleUser(userId) {
    try {
        const response = await fetch(`http://egovservices.runasp.net/api/Admin/users/${userId}/toggle`, {
            method: 'PATCH',
            headers: { 
                'Authorization': `Bearer ${localStorage.getItem('userToken')}`,
                'Content-Type': 'application/json'
            }
        });

        if (response.ok) {
           
            fetchAndDisplayUsers();
        } else {
            console.error("فشل التبديل، رمز الحالة:", response.status);
            alert("حدث خطأ أثناء محاولة تغيير حالة المستخدم.");
        }
    } catch (error) {
        console.error("خطأ في الاتصال:", error);
    }
}
       
        document.addEventListener('DOMContentLoaded', () => {
            loadsidebar();
            loadheader();
            fetchAndDisplayUsers();
        });
    </script>
</body>
</html>
