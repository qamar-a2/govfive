<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نموذج الخدمة</title>
  <link rel="stylesheet" href="global.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #EFEBE3;
      color: #042522;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    .service-card,
    .form-card {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.07);
      margin-bottom: 32px;
    }

    .form-card {
      background-image: url(image/شعار.png);
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
    }


    .service-title {
      font-size: 30px;
      font-weight: bold;
      color: #96835F;
      margin-bottom: 8px;
    }

    .service-desc {
      font-size: 15px;
      color: #042522;
      /* opacity: 0.8; */
      margin-bottom: 12px;
      font-weight: 600;
    }

    .service-meta span {
      font-size: 14px;
      color: #96835F;
      font-weight: 600;
    }

    .service-meta {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .field-wrapper {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-wrapper.full-width {
      grid-column: span 2;
    }

    .field-wrapper select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23333' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-size: 16px 16px;
      background-position: left 12px center;
      /* هاد الرقم زودو لتحرك السهم يمين */
      padding-left: 32px;
      /* خليه أكبر من background-position عشان النص ما يتراكب مع السهم */
    }

    label {
      font-size: 14px;
      font-weight: 600;
      color: #042522;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border: 1.2px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
      color: #042522;
      outline: none;
      transition: border-color 0.2s;
    }

    /* فوكس أخضر */
    input:focus,
    select:focus,
    textarea:focus {
      border-color: #2e6b4f;
      box-shadow:
        0 0 0 4px rgba(150, 129, 96, 0.09);
    }

    .submit-btn {
      margin-top: 28px;
      width: 100%;
      padding: 14px;
      background: #042522;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .submit-btn:hover {
      opacity: 0.9;
    }

    .file-picker {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1.2px solid #ccc;
      border-radius: 10px;
      cursor: pointer;
    }

    .file-picker:hover {
      border-color: #2e6b4f;
    }

    .file-picker.selected {
      border-color: #2e6b4f;
    }

    .file-picker-icon {
      color: #042522;
      font-size: 20px;
    }

    .help-text {
      font-size: 12px;
      color: #555;
    }

    .error-text {
      font-size: 12px;
      color: red;
      display: none;
    }

    .error-text.visible {
      display: block;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .field-wrapper.full-width {
        grid-column: span 1;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="service-card" id="service-info">
    </div>

    <div class="form-card">
      <form id="dynamic-form" novalidate>
        <div class="form-grid" id="form-fields"></div>
        <button class="submit-btn">إرسال الطلب</button>
      </form>
    </div>
  </div>
  

  <script>
    //--------------هون الربط---------------/
    const params = new URLSearchParams(window.location.search);
    const serviceId = params.get("id");
    const token = localStorage.getItem("userToken");
    let currentServiceType = null;//خزنا nullمشان نوع الخدمه وشرط الملف 
    const BASE = "http://egovservices.runasp.net";

    let slotsDataMap = {}; // خزّنا فيها بيانات كل سلوت (slotId -> slotDate) ان نستخدمها بحقل التاريخ المخفي

    //---------- جلب المواعيد المتاحة للفرع/الخدمة----------//
    async function loadAppointmentSlots() {
      try {
        const today = new Date().toISOString().split("T")[0];
        const res = await fetch(BASE + "/api/Appointments/slots/" + serviceId + "?fromDate=" + today, {
          headers: { "Authorization": "Bearer " + token }
        });
        const result = await res.json();
        const slots = result.data || result;
        var options = "<option value=''>اختر الموعد...</option>";
        slots.forEach(function (s) {
          slotsDataMap[s.slotId] = s.slotDate; // خزّنا التاريخ تبع كل سلوت
          const label = s.slotDate + " | " + s.startTime + " - " + s.endTime + " (متاح: " + s.availableSeats + ")";
          options += "<option value='" + s.slotId + "'>" + label + "</option>";
        });
        return options;
      } catch (err) {
        console.error(err);
        return "<option value=''>تعذر تحميل المواعيد</option>";
      }
    }

    async function loadServiceSchema() {
      if (!serviceId) return;

      try {
        const res = await fetch(BASE + "/api/Services/" + serviceId + "/schema", {
          headers: { "Authorization": "Bearer " + token }
        });
        const result = await res.json();
        const schema = result.data || result;
        currentServiceType = schema.serviceType;//هون رجعت النوع للخدمة اذا بدا حضور مشان الملف
        document.getElementById("service-info").innerHTML =
          "<h2>" + schema.serviceName + "</h2>" +
          "<p>" + schema.description + "</p>" +
          "<p>المتطلبات: " + schema.requirements + "</p>" +
          "<p>الرسوم: " + schema.serviceFee + " ل.س</p>" +
          "<span>" + schema.serviceTypeLabel + "</span>";

        const formFields = document.getElementById("form-fields");
        formFields.innerHTML = "";

        const requiresAttendance = schema.branches && schema.branches.length > 0;

        if (requiresAttendance) {
          formFields.innerHTML += `<div class="field-wrapper"><label>اختر الفرع</label><select id="branch-select" name="branchId" required><option value="">اختر الفرع...</option>${schema.branches.map(b => `<option value="${b.id}">${b.name}</option>`).join("")}</select></div>`;

          const slotOptions = await loadAppointmentSlots();
          formFields.innerHTML += "<div class='field-wrapper'><label>اختر الموعد المتاح</label><select id='slot-select' name='appointmentSlotId' required>" + slotOptions + "</select></div>";
        }

        schema.fields.forEach(function (field) {
          // إذا الخدمة بتتطلب حضور، الحقل تبع "تاريخ الاستلام" ما بيتعرض للمستخدم يدوياً
          // بس بنحطه كحقل مخفي وقيمته بتنعبى تلقائياً من تاريخ الموعد المختار
          if (requiresAttendance && field.label && field.label.indexOf("تاريخ الاستلام") !== -1) {
            formFields.innerHTML += "<input type='hidden' name='" + field.name + "' id='delivery-date-hidden' value=''>";
            return;
          }

          let inputHTML = "";

          if (field.type === "select" && field.options) {
            inputHTML = "<select name='" + field.name + "' " + (field.required ? "required" : "") + ">";
            inputHTML += "<option value=''>اختر...</option>";
            field.options.forEach(function (o) {
              inputHTML += "<option value='" + o.value + "'>" + o.label + "</option>";
            });
            inputHTML += "</select>";
          } else if (field.type === "textarea") {
            inputHTML = "<textarea name='" + field.name + "' placeholder='" + field.label + "' " + (field.required ? "required" : "") + "></textarea>";
          } else {
            inputHTML = "<input type='" + field.type + "' name='" + field.name + "' placeholder='" + field.label + "' " + (field.required ? "required" : "") + ">";
          }

          formFields.innerHTML += "<div class='field-wrapper'><label>" + field.label + "</label>" + inputHTML + "</div>";
        });

        // بعد ما رسمنا كل شي، اربطي تغيير الموعد بتحديث حقل التاريخ المخفي تلقائياً
        if (requiresAttendance) {
          const slotSelect = document.getElementById("slot-select");
          const hiddenDate = document.getElementById("delivery-date-hidden");
          if (slotSelect && hiddenDate) {
            slotSelect.addEventListener("change", function () {
              hiddenDate.value = slotsDataMap[slotSelect.value] || "";
            });
          }
        }

      } catch (err) {
        console.error(err);
      }

    }
    //ربط ارسال الطلب ويعطي اشعار ويرجع ملف -------------ر-//
    async function submitServiceRequest(event) {
      if (event) event.preventDefault();

      const urlParams = new URLSearchParams(window.location.search);
      const currentServiceId = urlParams.get('id');

      const dynamicFields = {};
      const inputs = document.querySelectorAll("#form-fields input, #form-fields select, #form-fields textarea");

      inputs.forEach(input => {
        if (input.name && input.id !== "branch-select" && input.id !== "slot-select") {
          dynamicFields[input.name] = input.value;
        }
      });

      const branchSelect = document.getElementById("branch-select");
      const slotSelect = document.getElementById("slot-select");

      const payload = {
        serviceId: currentServiceId,
        formData: dynamicFields,
        branchId: (branchSelect && branchSelect.value) ? branchSelect.value : null,
        appointmentSlotId: (slotSelect && slotSelect.value) ? slotSelect.value : null
      };

      try {
        const res = await fetch(BASE + "/api/Services/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
          },
          body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (!res.ok || !result.success) {
          alert("فشل إرسال الطلب: " + (result.message || "تأكد من الحقول المطلوبة"));
          return;
        }

        const requestId = result.data.requestId;
        alert(result.data.message || "تم إرسال الطلب بنجاح! 🎉");

        if (currentServiceType === 0) {
          await processAndDownloadDocument(requestId);
        }

      } catch (error) {
        console.error("Error submitting form:", error);
        alert("حدث خطأ أثناء الاتصال بالسيرفر.");
      }
    }
    ////تجهيز تنزيل الملف هوون بلش ------------/
    async function processAndDownloadDocument(requestId) {
      try {
        const processRes = await fetch(BASE + "/api/documents/process/" + requestId, {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token
          }
        });

        const processResult = await processRes.json();

        if (!processRes.ok || !processResult.success || processResult.data.status !== "Completed") {
          alert("تعذر تجهيز الوثيقة: " + (processResult.data ? processResult.data.resultMessage : "خطأ غير معروف"));
          return;
        }

        const downloadRes = await fetch(BASE + "/api/documents/download/" + requestId, {
          method: "GET",
          headers: {
            "Authorization": "Bearer " + token
          }
        });

        if (!downloadRes.ok) {
          alert("تعذر تحميل الملف.");
          return;
        }

        const blob = await downloadRes.blob();//يروح يجيب الملف هو نوع بلوب 
        const downloadUrl = window.URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = downloadUrl;
        link.download = "document.pdf";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        window.URL.revokeObjectURL(downloadUrl);

      } catch (error) {
        console.error("Error processing/downloading document:", error);
        alert("حدث خطأ أثناء تجهيز أو تحميل الوثيقة.");
      }
    }

    // الربط التلقائي لحماية الزر الكحلي الأصلي مشان مايخرب الشكل
    document.addEventListener("DOMContentLoaded", function () {
      const myButton = document.querySelector(".submit-btn") || document.querySelector(".start-btn");
      if (myButton) {
        myButton.type = "button";
        myButton.addEventListener("click", submitServiceRequest);
      }
    });
    loadServiceSchema();
  </script>

</body>

</html>
