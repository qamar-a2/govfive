<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GovFive - داشبورد الموظف</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0ede8;
      min-height: 100vh;
    }

    .tab-active {
      background: #042522;
      color: white;
    }

    .tab-inactive {
      background: white;
      color: #6b7280;
    }

    .badge-pending {
      background: #FEF3C7;
      color: #92400E;
    }

    .badge-review {
      background: #EDE9FE;
      color: #5B21B6;
    }

    .badge-done {
      background: #D1FAE5;
      color: #065F46;
    }

    .badge-cancelled {
      background: #FEE2E2;
      color: #991B1B;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="bg-[#042522] sticky top-0 z-50 shadow-lg">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-[#96835F] flex items-center justify-center text-white font-bold">e</div>
        <div>
          <div class="text-white font-bold text-sm" id="user-name">...</div>
          <div class="text-white/50 text-xs" id="user-role">...</div>
        </div>
      </div>
      <div class="text-[#96835F] font-bold text-lg">Employee</div>
    </div>
  </header>

  <!-- Stats -->
  <div class="max-w-4xl mx-auto px-4 mt-6 grid grid-cols-3 gap-4 mb-6">
    <div class="card text-center border-b-4 border-[#042522]">
      <div class="text-3xl font-bold text-[#042522]" id="stat-total">--</div>
      <div class="text-gray-500 text-sm mt-1">إجمالي الطلبات</div>
    </div>
    <div class="card text-center border-b-4 border-yellow-400">
      <div class="text-3xl font-bold text-yellow-600" id="stat-pending">--</div>
      <div class="text-gray-500 text-sm mt-1">قيد التنفيذ</div>
    </div>
    <div class="card text-center border-b-4 border-green-400">
      <div class="text-3xl font-bold text-green-600" id="stat-done">--</div>
      <div class="text-gray-500 text-sm mt-1">مكتملة</div>
    </div>
  </div>

  <!-- Tabs -->
  <div class="max-w-4xl mx-auto px-4 mb-4">
    <div class="flex bg-white p-1 rounded-2xl gap-2 shadow-sm">
      <button onclick="showTab('requests')" id="btn-requests"
        class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all tab-active">
        الطلبات
      </button>
      <button onclick="showTab('appointments')" id="btn-appointments"
        class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all tab-inactive">
        المواعيد
      </button>
    </div>
  </div>

  <!-- Requests Tab -->
  <div id="tab-requests" class="max-w-4xl mx-auto px-4 space-y-3">
    <div id="requests-list">
      <div class="text-center text-gray-400 py-10">جاري تحميل الطلبات...</div>
    </div>
  </div>

  <!-- Appointments Tab -->
  <div id="tab-appointments" class="max-w-4xl mx-auto px-4 hidden">

    <!-- Add Slot -->
    <div class="card mb-4">
      <h2 class="font-bold text-[#042522] mb-4">إضافة موعد متاح</h2>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-sm text-gray-500 mb-1 block">الخدمة</label>
          <select id="slot-service"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-[#042522]">
            <option value="">اختر الخدمة...</option>
          </select>
        </div>
        <div>
          <label class="text-sm text-gray-500 mb-1 block">التاريخ والوقت</label>
          <input type="datetime-local" id="slot-datetime"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-[#042522]">
        </div>
        <div>
          <label class="text-sm text-gray-500 mb-1 block">الطاقة الاستيعابية</label>
          <input type="number" id="slot-capacity" placeholder="عدد المراجعين" min="1"
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-[#042522]">
        </div>
        <div class="flex items-end">
          <button onclick="addSlot()"
            class="w-full bg-[#042522] text-white py-2 rounded-xl text-sm font-bold hover:bg-[#042522]/90 transition">
            إضافة الموعد
          </button>
        </div>
      </div>
      <div id="slot-msg" class="mt-3 text-sm hidden"></div>
    </div>

    <!-- Pending Appointment Reviews -->
    <div class="card">
      <h2 class="font-bold text-[#042522] mb-4">طلبات المواعيد - بانتظار المراجعة</h2>
      <div id="appointments-list">
        <div class="text-center text-gray-400 py-6">لا توجد طلبات مواعيد حالياً</div>
      </div>
    </div>
  </div>

  <!-- Modal for Request Details -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-[#042522] text-lg">تفاصيل الطلب</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600">✕</button>
      </div>
      <div id="modal-content"></div>
      <div class="mt-4 space-y-3">
        <textarea id="note-input" placeholder="أضف ملاحظة على الطلب..."
          class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-[#042522] resize-none"
          rows="3"></textarea>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="updateStatus('Approved')"
            class="bg-green-500 text-white py-2 rounded-xl text-sm font-bold hover:bg-green-600 transition">
            قبول
          </button>
          <button onclick="updateStatus('Rejected')"
            class="bg-red-500 text-white py-2 rounded-xl text-sm font-bold hover:bg-red-600 transition">
            رفض
          </button>
          <button onclick="addNote()"
            class="bg-[#96835F] text-white py-2 rounded-xl text-sm font-bold hover:bg-[#96835F]/90 transition">
            إضافة ملاحظة
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const BASE = "http://egovservices.runasp.net";
    const token = localStorage.getItem("userToken");
    let currentRequestId = null;
    let allRequests = [];

    // 🛠️ دالة تنظيف النصوص
    function cleanText(text) {
      if (text === null || text === undefined) return "";
      const str = String(text);
      return str.replace(/^["\s,]+|["\s,]+$/g, '').trim();
    }

    // 1️⃣ استخلاص الخدمات تلقائياً من الطلبات وتجهيز الـ IDs
    function loadServicesFromRequests() {
      const selectEl = document.getElementById("slot-service");
      if (!selectEl) return;

      const uniqueServices = [];
      const serviceNames = new Set();

      allRequests.forEach(function (req) {
        const sName = cleanText(req.serviceName || req.name || "");

        // محاولة جلب معرف الخدمة إن وجد، أو استخدام معرّف بديل مؤقتاً
        //const sId = req.serviceId || req.id || ""; 
        // استبدلي السطر القديم بهذا السطر تماماً لضمان جلب GUID الخدمة الفعلي:
        const sId = (req.governmentService ? req.governmentService.id : null) || req.governmentServiceId || req.serviceId || "";

        if (sName && !serviceNames.has(sName)) {
          serviceNames.add(sName);
          uniqueServices.push({
            id: sId,
            name: sName
          });
        }
      });

      selectEl.innerHTML = '<option value="" disabled selected>اختر الخدمة...</option>';
      uniqueServices.forEach(function (service) {
        const option = document.createElement("option");
        option.value = service.id;
        option.textContent = service.name;
        selectEl.appendChild(option);
      });
    }

    // 2️⃣ جلب معلومات الموظف الشخصية
    async function loadUserInfo() {
      if (!token) return;
      try {
        const res = await fetch(BASE + "/api/Auth/me", {
          headers: { "Authorization": "Bearer " + token }
        });
        if (!res.ok) return;
        const result = await res.json();
        const user = result.data || result;

        if (user) {
          document.getElementById("user-name").textContent = cleanText(user.fullName || user.name || "");
          document.getElementById("user-role").textContent = user.role || "موظف";
        }
      } catch (err) {
        console.error("Error loading user info:", err);
      }
    }

    // 3️⃣ جلب الطلبات من السيرفر
    async function loadRequests() {
      if (!token) {
        console.warn("Token is missing!");
        return;
      }
      try {
        const res = await fetch(BASE + "/api/Employee/requests", {
          headers: { "Authorization": "Bearer " + token }
        });

        if (!res.ok) {
          throw new Error("HTTP error " + res.status);
        }

        const result = await res.json();

        if (result && result.data && Array.isArray(result.data.items)) {
          allRequests = result.data.items;
        } else if (result && Array.isArray(result.data)) {
          allRequests = result.data;
        } else if (result && Array.isArray(result.items)) {
          allRequests = result.items;
        } else if (Array.isArray(result)) {
          allRequests = result;
        } else {
          allRequests = [];
        }

        // تحديث بطاقات الإحصائيات في الأعلى
        const totalRequests = allRequests.length;
        const pendingRequests = allRequests.filter(function (r) {
          return r.status === "PendingPayment" || r.status === 0 || r.status === 1;
        }).length;
        const doneRequests = allRequests.filter(function (r) {
          return r.status === "Approved" || r.status === 2;
        }).length;

        const statTotalEl = document.getElementById("stat-total");
        const statPendingEl = document.getElementById("stat-pending");
        const statDoneEl = document.getElementById("stat-done");

        if (statTotalEl) statTotalEl.textContent = totalRequests;
        if (statPendingEl) statPendingEl.textContent = pendingRequests;
        if (statDoneEl) statDoneEl.textContent = doneRequests;

        renderRequests(allRequests);

        // استدعاء دالة بناء قائمة الخدمات المنسدلة تلقائياً
        loadServicesFromRequests();

      } catch (err) {
        console.error("Error loading requests:", err);
        const listEl = document.getElementById("requests-list");
        if (listEl) {
          listEl.innerHTML = "<div class='text-center text-red-400 py-10'>حدث خطأ في تحميل الطلبات</div>";
        }
      }
    }

    // 4️⃣ عرض الطلبات في القائمة
    function renderRequests(requests) {
      const list = document.getElementById("requests-list");
      if (!list) return;

      if (!requests || requests.length === 0) {
        list.innerHTML = "<div class='text-center text-gray-400 py-10'>لا توجد طلبات</div>";
        return;
      }

      list.innerHTML = "";
      requests.forEach(function (req) {
        let badgeClass = "badge-pending";
        let statusLabel = "بانتظار الدفع";

        if (req.status === "PendingPayment" || req.status === 0) {
          badgeClass = "badge-pending";
          statusLabel = "بانتظار الدفع";
        } else if (req.status === 1) {
          badgeClass = "badge-review";
          statusLabel = "قيد التدقيق";
        } else if (req.status === "Approved" || req.status === 2) {
          badgeClass = "badge-done";
          statusLabel = "مكتملة";
        } else if (req.status === 3) {
          badgeClass = "badge-cancelled";
          statusLabel = "ملغاة";
        }

        const cleanServiceName = cleanText(req.serviceName || req.name || "طلب");
        const cleanCitizenName = cleanText(req.citizenName || req.userName || req.userFullName || "");
        const dateStr = req.submissionDate || req.createdAt || "";

        list.innerHTML += "<div class='card mb-3 flex items-center justify-between cursor-pointer hover:shadow-md transition' onclick='openModal(\"" + req.id + "\")'>" +
          "<div class='flex items-center gap-4'>" +
          "<div class='bg-[#96835F]/10 p-3 rounded-xl'>" +
          "<svg class='w-7 h-7 text-[#96835F]' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'></path></svg>" +
          "</div>" +
          "<div>" +
          "<h3 class='font-bold text-gray-800'>" + cleanServiceName + "</h3>" +
          "<p class='text-sm text-gray-500'>" + cleanCitizenName + "</p>" +
          "<p class='text-xs text-gray-400 mt-1'>" + (dateStr ? dateStr.slice(0, 10) : "") + "</p>" +
          "</div></div>" +
          "<div class='flex flex-col items-end gap-2'>" +
          "<span class='" + badgeClass + " px-3 py-1 rounded-full text-xs font-bold'>" + statusLabel + "</span>" +
          "<svg class='w-5 h-5 text-gray-300' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 5l7 7-7 7'></path></svg>" +
          "</div></div>";
      });
    }

    // 5️⃣ فتح نافذة تفاصيل الطلب
    function openModal(id) {
      currentRequestId = id;
      const req = allRequests.find(function (r) { return r.id === id; });
      if (!req) return;

      const cleanServiceName = cleanText(req.serviceName || req.name || "");
      const cleanCitizenName = cleanText(req.citizenName || req.userName || req.userFullName || "");
      const dateStr = req.submissionDate || req.createdAt || "";

      const modalContentEl = document.getElementById("modal-content");
      if (modalContentEl) {
        modalContentEl.innerHTML =
          "<div class='space-y-2 text-sm'>" +
          "<div class='flex justify-between'><span class='text-gray-500'>الخدمة:</span><span class='font-bold'>" + cleanServiceName + "</span></div>" +
          "<div class='flex justify-between'><span class='text-gray-500'>المستخدم:</span><span class='font-bold'>" + cleanCitizenName + "</span></div>" +
          "<div class='flex justify-between'><span class='text-gray-500'>الرقم الوطني:</span><span class='font-bold'>" + (req.citizenNationalNumber || "غير متوفر") + "</span></div>" +
          "<div class='flex justify-between'><span class='text-gray-500'>التاريخ:</span><span>" + (dateStr ? dateStr.slice(0, 10) : "") + "</span></div>" +
          "<div class='flex justify-between'><span class='text-gray-500'>الرقم المرجعي:</span><span class='text-xs text-gray-400'>" + req.id + "</span></div>" +
          "</div>";
      }

      const modalEl = document.getElementById("modal");
      if (modalEl) modalEl.classList.remove("hidden");
    }

    // 6️⃣ إغلاق النافذة المنبثقة
    function closeModal() {
      const modalEl = document.getElementById("modal");
      if (modalEl) modalEl.classList.add("hidden");

      const noteInput = document.getElementById("note-input");
      if (noteInput) noteInput.value = "";

      currentRequestId = null;
    }

    // 7️⃣ تحديث حالة الطلب (معدلة لتطابق حقل الباك إند المطلوب)
    async function updateStatus(status) {
      if (!currentRequestId) return;
      try {
        const res = await fetch(BASE + "/api/Employee/requests/" + currentRequestId + "/status", {
          method: "PATCH",
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          // هنا السر! أرسلنا الحقل باسم NewStatus بدلاً من status
          body: JSON.stringify({ NewStatus: status })
        });

        if (res.ok) {
          closeModal();
          loadRequests();
        } else {
          const errData = await res.json();
          console.error("فشل التحديث من السيرفر:", errData);
          alert("لم يتم قبول الحالة من السيرفر. تحقق من الكونسول.");
        }
      } catch (err) {
        console.error("Error updating status:", err);
      }
    }

    // 8️⃣ إضافة ملاحظة على الطلب
    async function addNote() {
      if (!currentRequestId) return;
      const noteInput = document.getElementById("note-input");
      if (!noteInput) return;

      const note = noteInput.value.trim();
      if (!note) return;
      try {
        await fetch(BASE + "/api/Employee/requests/" + currentRequestId + "/note", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ note: note })
        });
        noteInput.value = "";
        alert("تمت إضافة الملاحظة");
      } catch (err) {
        console.error("Error adding note:", err);
      }
    }

    async function addSlot() {
      const serviceIdEl = document.getElementById("slot-service");
      const datetimeEl = document.getElementById("slot-datetime");
      const capacityEl = document.getElementById("slot-capacity");
      const msgEl = document.getElementById("slot-msg");

      if (!serviceIdEl || !datetimeEl || !capacityEl || !msgEl) return;

      // تنظيف الرسالة السابقة
      msgEl.textContent = "";
      msgEl.classList.add("hidden");

      const serviceId = serviceIdEl.value;
      const rawDatetime = datetimeEl.value; // القيمة تكون مثل: "2026-08-12T13:00"
      const capacity = capacityEl.value;

      if (!serviceId || !rawDatetime || !capacity) {
        msgEl.textContent = "يرجى تعبئة جميع الحقول";
        msgEl.className = "mt-3 text-sm text-red-500";
        msgEl.classList.remove("hidden");
        return;
      }

      // معالجة التاريخ والوقت ليتوافق مع طلب السيرفر (slotDate, startTime, endTime)
      const localDate = new Date(rawDatetime);
      if (isNaN(localDate.getTime())) {
        msgEl.textContent = "صيغة التاريخ غير صالحة";
        msgEl.className = "mt-3 text-sm text-red-500";
        msgEl.classList.remove("hidden");
        return;
      }

      // 1️⃣ استخراج التاريخ بصيغة YYYY-MM-DD
      const slotDate = rawDatetime.split('T')[0];

      // 2️⃣ استخراج وقت البدء بصيغة HH:MM
      const startTime = rawDatetime.split('T')[1] || "09:00";

      // 3️⃣ حساب وقت النهاية تلقائياً (مثلاً بعد ساعة واحدة من وقت البدء)
      const endHours = parseInt(startTime.split(':')[0]) + 1;
      const endMinutes = startTime.split(':')[1];
      const endTime = (endHours < 10 ? '0' + endHours : endHours) + ':' + endMinutes;

      try {
        const res = await fetch(BASE + "/api/Appointments/slots", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            governmentServiceId: serviceId, // تطابق تام مع Swagger!
            slotDate: slotDate,             // تطابق تام مع Swagger!
            startTime: startTime,           // تطابق تام مع Swagger!
            endTime: endTime,               // تطابق تام مع Swagger!
            totalSeats: parseInt(capacity)  // تطابق تام مع Swagger!
          })
        });

        if (res.ok) {
          msgEl.textContent = "تمت إضافة الموعد بنجاح!";
          msgEl.className = "mt-3 text-sm text-green-500 font-bold";
          msgEl.classList.remove("hidden");
          datetimeEl.value = "";
          capacityEl.value = "";
        } else {
          const errResult = await res.json();
          msgEl.textContent = errResult.message || "فشل إضافة الموعد، تأكدي من توافق المدخلات";
          msgEl.className = "mt-3 text-sm text-red-500";
          msgEl.classList.remove("hidden");
        }
      } catch (err) {
        console.error("Error adding slot:", err);
        msgEl.textContent = "حدث خطأ أثناء الاتصال بالخادم";
        msgEl.className = "mt-3 text-sm text-red-500";
        msgEl.classList.remove("hidden");
      }
    }

    function showTab(tab) {
      const tabRequests = document.getElementById("tab-requests");
      const tabAppointments = document.getElementById("tab-appointments");
      const btnRequests = document.getElementById("btn-requests");
      const btnAppointments = document.getElementById("btn-appointments");

      if (tabRequests) tabRequests.classList.add("hidden");
      if (tabAppointments) tabAppointments.classList.add("hidden");
      if (btnRequests) btnRequests.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all tab-inactive";
      if (btnAppointments) btnAppointments.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all tab-inactive";

      const activeTab = document.getElementById("tab-" + tab);
      const activeBtn = document.getElementById("btn-" + tab);

      if (activeTab) activeTab.classList.remove("hidden");
      if (activeBtn) activeBtn.className = "flex-1 py-3 px-4 rounded-xl font-bold text-sm transition-all tab-active";
    }

    // تهيئة البيانات عند تحميل الصفحة
    loadRequests();
    loadUserInfo();
  </script>
</body>

</html>
