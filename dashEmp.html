<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GovFive - داشبورد الموظف</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0ede8;
      min-height: 100vh;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="bg-[#042522] sticky top-0 z-50 shadow-lg">
    <div class="max-w-4xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='prof.html'">
        <div
          class="w-9 h-9 rounded-full bg-[#96835F] flex items-center justify-center text-white font-bold hover:opacity-80 transition"
          id="user-avatar"></div>
        <div>
          <div class="text-white font-bold text-sm" id="user-name">...</div>
          <div class="text-white/50 text-xs"></div>
        </div>
      </div>
      <div class="text-[#96835F] font-bold text-lg">Employee</div>
    </div>
  </header>

  <!-- Stats -->
  <div class="max-w-4xl mx-auto px-4 mt-6 grid grid-cols-3 gap-4 mb-6">
    <div class="card text-center border-b-4 border-[#042522]">
      <div class="text-3xl font-bold text-[#042522]" id="stat-total">--</div>
      <div class="text-gray-500 text-sm mt-1">اجمالي الطلبات</div>
    </div>
    <div class="card text-center border-b-4 border-yellow-400">
      <div class="text-3xl font-bold text-yellow-600" id="stat-pending">--</div>
      <div class="text-gray-500 text-sm mt-1">قيد التنفيذ</div>
    </div>
    <div class="card text-center border-b-4 border-green-400">
      <div class="text-3xl font-bold text-green-600" id="stat-done">--</div>
      <div class="text-gray-500 text-sm mt-1">مكتملة</div>
    </div>
  </div>

  <!-- Requests -->
  <div class="max-w-4xl mx-auto px-4 mb-3">
    <h2 class="font-bold text-[#042522] text-lg mb-1">الطلبات</h2>
  </div>
  <div class="max-w-4xl mx-auto px-4 space-y-3">
    <div id="requests-list">
      <div class="text-center text-gray-400 py-10">جاري تحميل الطلبات...</div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-[#042522] text-lg">تفاصيل الطلب</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-xl">x</button>
      </div>
      <div id="modal-content" class="mb-4"></div>

      <div class="space-y-3">
        <div>
          <label class="text-sm text-gray-500 mb-1 block">ملاحظات المعالجة</label>
          <textarea id="notes-input" placeholder="اكتب ملاحظاتك هنا..."
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-[#042522] resize-none"
            rows="2"></textarea>
        </div>
        <div id="reject-section" class="hidden">
          <label class="text-sm text-gray-500 mb-1 block">سبب الرفض</label>
          <input type="text" id="reject-reason" placeholder="سبب الرفض..."
            class="w-full border border-gray-200 rounded-xl px-3 py-2 text-sm outline-none focus:border-[#042522]">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="updateStatus('AppointmentConfirmed')"
            class="bg-green-500 text-white py-2 rounded-xl text-sm font-bold hover:bg-green-600 transition">
            قبول الطلب
          </button>
          <button onclick="showReject()"
            class="bg-red-500 text-white py-2 rounded-xl text-sm font-bold hover:bg-red-600 transition">
            رفض الطلب
          </button>
        </div>
        <button id="confirm-reject" onclick="updateStatus('AppointmentCancelled')"
          class="hidden w-full bg-red-700 text-white py-2 rounded-xl text-sm font-bold">
          تاكيد الرفض
        </button>
        <button onclick="editRequest()"
          class="w-full bg-[#96835F] text-white py-2 rounded-xl text-sm font-bold hover:bg-[#96835F]/90 transition">
          تعديل الطلب
        </button>
        <div id="modal-msg" class="text-sm text-center hidden"></div>
      </div>
    </div>
  </div>

  <script>
    var BASE = "http://egovservices.runasp.net";
    var token = localStorage.getItem("userToken");
    var currentRequestId = null;
    var allRequests = [];

    // Load user info
    async function loadUserInfo() {
      try {
        var res = await fetch(BASE + "/api/Auth/me", {
          headers: { "Authorization": "Bearer " + token }
        });
        var result = await res.json();
        var user = result.data || result;
        var name = user.fullName || user.name || "الموظف ";
        document.getElementById("user-name").textContent = name;
        document.getElementById("user-avatar").textContent = name.charAt(0);
      } catch (err) { console.error(err); }
    }

    // Load requests
    async function loadRequests() {
      try {
        var res = await fetch(BASE + "/api/Employee/requests", {
          headers: { "Authorization": "Bearer " + token }
        });
        var result = await res.json();
        var data = result.data || result;
        allRequests = data.items || data;

        var total = allRequests.length;
        var pending = allRequests.filter(function (r) {
          return r.status === "PendingPayment" || r.status === "UnderReview" || r.status === "DocumentsUnderReview" || r.status === "Pending";
        }).length;
        var done = allRequests.filter(function (r) {
          return r.status === "Completed" || r.status === "AppointmentConfirmed";
        }).length;

        document.getElementById("stat-total").textContent = total;
        document.getElementById("stat-pending").textContent = pending;
        document.getElementById("stat-done").textContent = done;

        renderRequests(allRequests);
      } catch (err) {
        console.error(err);
        document.getElementById("requests-list").innerHTML =
          "<div class='text-center text-red-400 py-10'>حدث خطا في تحميل الطلبات</div>";
      }
    }

    function getStatusLabel(status) {
      if (status === "PendingPayment") return "بانتظار الدفع";
      if (status === "UnderReview") return "قيد المراجعة";
      if (status === "DocumentsUnderReview") return "قيد مراجعة المستندات";
      if (status === "Approved") return "مقبول";
      if (status === "Rejected") return "مرفوض";
      if (status === "AppointmentConfirmed") return "تم تأكيد الموعد";
      if (status === "AppointmentCancelled") return "تم إلغاء الموعد";
      if (status === "Completed") return "مكتمل";
      return status || "";
    }

    function getStatusClass(status) {
      if (status === "Approved" || status === "Completed" || status === "AppointmentConfirmed") return "bg-green-100 text-green-700";
      if (status === "Rejected" || status === "AppointmentCancelled") return "bg-red-100 text-red-700";
      if (status === "UnderReview" || status === "DocumentsUnderReview") return "bg-purple-100 text-purple-700";
      return "bg-yellow-100 text-yellow-700";
    }

    function renderRequests(requests) {
      var list = document.getElementById("requests-list");
      if (!requests || requests.length === 0) {
        list.innerHTML = "<div class='text-center text-gray-400 py-10'>لا توجد طلبات</div>";
        return;
      }
      list.innerHTML = "";
      requests.forEach(function (req) {
        var statusLabel = getStatusLabel(req.status);
        var statusClass = getStatusClass(req.status);
        var date = req.submissionDate ? req.submissionDate.slice(0, 10) : "";

        list.innerHTML += "<div class='card mb-3 flex items-center justify-between cursor-pointer hover:shadow-md transition' onclick='openModal(\"" + req.id + "\")'>" +
          "<div class='flex items-center gap-4'>" +
          "<div class='bg-[#96835F]/10 p-3 rounded-xl'>" +
          "<svg class='w-7 h-7 text-[#96835F]' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z'></path></svg>" +
          "</div>" +
          "<div>" +
          "<h3 class='font-bold text-gray-800'>" + (req.serviceName || "طلب") + "</h3>" +
          "<p class='text-sm text-gray-500'>" + (req.citizenName || "") + "</p>" +
          "<p class='text-xs text-gray-400 mt-1'>" + date + "</p>" +
          "</div></div>" +
          "<div class='flex flex-col items-end gap-2'>" +
          "<span class='" + statusClass + " px-3 py-1 rounded-full text-xs font-bold'>" + statusLabel + "</span>" +
          "</div></div>";
      });
    }

    // فتح المودال: يجيب تفاصيل الطلب الكاملة من GET /api/Employee/requests/{id}
    async function openModal(id) {
      currentRequestId = id;

      document.getElementById("reject-section").classList.add("hidden");
      document.getElementById("confirm-reject").classList.add("hidden");
      document.getElementById("notes-input").value = "";
      document.getElementById("modal-msg").classList.add("hidden");
      document.getElementById("modal-content").innerHTML = "<div class='text-center text-gray-400 py-6'>جاري تحميل التفاصيل...</div>";
      document.getElementById("modal").classList.remove("hidden");

      try {
        var res = await fetch(BASE + "/api/Employee/requests/" + id, {
          headers: { "Authorization": "Bearer " + token }
        });
        var result = await res.json();
        var req = result.data || result;
        renderModalContent(req);
      } catch (err) {
        console.error(err);
        document.getElementById("modal-content").innerHTML = "<div class='text-center text-red-400 py-6'>حدث خطا في تحميل التفاصيل</div>";
      }
    }

    // يبني محتوى المودال، وبيكتشف حقول الملفات/الصور جوا formData والمرفقات
    function renderModalContent(req) {
      var formData = {};
      try {
        formData = typeof req.formData === "string" ? JSON.parse(req.formData) : (req.formData || {});
      } catch (err) {
        formData = {};
      }

      var html = "<div class='space-y-2 text-sm bg-gray-50 rounded-xl p-3'>" +
        "<div class='flex justify-between'><span class='text-gray-500'>الخدمة:</span><span class='font-bold'>" + (req.serviceName || "") + "</span></div>" +
        "<div class='flex justify-between'><span class='text-gray-500'>المواطن:</span><span class='font-bold'>" + (req.citizenName || "") + "</span></div>" +
        "<div class='flex justify-between'><span class='text-gray-500'>الرقم الوطني:</span><span>" + (req.citizenNationalNumber || "") + "</span></div>" +
        "<div class='flex justify-between'><span class='text-gray-500'>الرقم المرجعي:</span><span class='text-xs text-gray-400'>" + (req.referenceNumber || "") + "</span></div>" +
        "<div class='flex justify-between'><span class='text-gray-500'>تاريخ التقديم:</span><span>" + (req.submissionDate ? req.submissionDate.slice(0, 10) : "") + "</span></div>" +
        "<div class='flex justify-between'><span class='text-gray-500'>الحالة:</span><span>" + getStatusLabel(req.status) + "</span></div>";

      if (req.processingNotes) {
        html += "<div class='flex justify-between'><span class='text-gray-500'>ملاحظات المعالجة:</span><span>" + req.processingNotes + "</span></div>";
      }
      if (req.rejectionReason) {
        html += "<div class='flex justify-between'><span class='text-gray-500'>سبب الرفض:</span><span>" + req.rejectionReason + "</span></div>";
      }
      html += "</div>";

      var fileFields = [];
      var formKeys = Object.keys(formData);
      if (formKeys.length > 0) {
        html += "<div class='space-y-2 text-sm bg-gray-50 rounded-xl p-3 mt-3'>";
        formKeys.forEach(function (key) {
          var value = formData[key];
          var lowerKey = key.toLowerCase();
          var isFile = lowerKey.indexOf("photo") !== -1 || lowerKey.indexOf("image") !== -1 || lowerKey.indexOf("file") !== -1;
          if (isFile && value) {
            var placeholderId = "file-" + Math.random().toString(36).slice(2);
            html += "<div><div class='text-xs text-gray-400 mb-1'>" + key + "</div><div id='" + placeholderId + "' class='text-xs text-gray-400'>جاري تحميل المرفق...</div></div>";
            fileFields.push({ id: placeholderId, fileId: value });
          } else {
            html += "<div class='flex justify-between'><span class='text-gray-500'>" + key + ":</span><span>" + value + "</span></div>";
          }
        });
        html += "</div>";
      }

      if (req.attachments && req.attachments.length > 0) {
        html += "<div class='space-y-2 text-sm bg-gray-50 rounded-xl p-3 mt-3'><div class='text-gray-500 mb-1'>المرفقات:</div>";
        req.attachments.forEach(function (att) {
          var attFileId = typeof att === "string" ? att : (att.fileId || att.id);
          var placeholderId = "file-" + Math.random().toString(36).slice(2);
          html += "<div id='" + placeholderId + "' class='text-xs text-gray-400 mb-2'>جاري تحميل المرفق...</div>";
          fileFields.push({ id: placeholderId, fileId: attFileId });
        });
        html += "</div>";
      }

      document.getElementById("modal-content").innerHTML = html;

      fileFields.forEach(function (f) {
        if (f.fileId) attachFilePreview(f.fileId, f.id);
      });
    }

    // يجيب الملف بتوكن الدخول ويعرضه كصورة او كرابط تحميل حسب نوعه
    async function attachFilePreview(fileId, targetId) {
      var target = document.getElementById(targetId);
      if (!target) return;
      try {
        var res = await fetch(BASE + "/api/files/" + fileId, {
          headers: { "Authorization": "Bearer " + token }
        });
        if (!res.ok) throw new Error("file fetch failed");
        var blob = await res.blob();
        var url = URL.createObjectURL(blob);
        if (blob.type && blob.type.indexOf("image") === 0) {
          target.innerHTML = "<a href='" + url + "' target='_blank'><img src='" + url + "' class='rounded-lg max-h-40 border border-gray-200' alt='مرفق'></a>";
        } else {
          target.innerHTML = "<a href='" + url + "' target='_blank' download class='text-[#042522] underline text-sm'>عرض / تحميل المرفق</a>";
        }
      } catch (err) {
        console.error(err);
        target.innerHTML = "<span class='text-xs text-red-400'>تعذر تحميل المرفق</span>";
      }
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden");
      currentRequestId = null;
    }

    function showReject() {
      document.getElementById("reject-section").classList.remove("hidden");
      document.getElementById("confirm-reject").classList.remove("hidden");
    }

    async function updateStatus(newStatus) {
      if (!currentRequestId) return;

      if (newStatus === "AppointmentConfirmed" || newStatus === "AppointmentCancelled") {
        if (!confirm("هل أنت متأكد؟")) return;
      }

      var notes = document.getElementById("notes-input").value.trim();
      var reason = document.getElementById("reject-reason").value.trim();
      var msg = document.getElementById("modal-msg");

      try {
        var body = { "newStatus": newStatus, "processingNotes": notes };
        if (newStatus === "AppointmentCancelled") body["rejectionReason"] = reason;

        var res = await fetch(BASE + "/api/Employee/requests/" + currentRequestId + "/status", {
          method: "PATCH",
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });

        if (res.ok) {
          msg.textContent = newStatus === "AppointmentConfirmed" ? "تم قبول الطلب" : "تم رفض الطلب";
          msg.className = "text-sm text-center text-green-500";
          msg.classList.remove("hidden");
          setTimeout(function () { closeModal(); loadRequests(); }, 1500);
        } else {
          msg.textContent = "حدث خطا، حاول مجددا";
          msg.className = "text-sm text-center text-red-500";
          msg.classList.remove("hidden");
        }
      } catch (err) {
        console.error(err);
      }
    }

    // تعديل الطلب: نفس اند بوينت الحالة، بيرجع الطلب فورا لقيد مراجعة المستندات - بدون اي ملاحظة
    async function editRequest() {
      if (!currentRequestId) return;
      var msg = document.getElementById("modal-msg");
      try {
        var body = { "newStatus": "DocumentsUnderReview", "rejectionReason": null, "processingNotes": null };
        var res = await fetch(BASE + "/api/Employee/requests/" + currentRequestId + "/status", {
          method: "PATCH",
          headers: {
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(body)
        });
        if (res.ok) {
          msg.textContent = "تم تعديل الطلب الى قيد مراجعة المستندات";
          msg.className = "text-sm text-center text-green-500";
          msg.classList.remove("hidden");
          setTimeout(function () { closeModal(); loadRequests(); }, 1500);
        } else {
          msg.textContent = "حدث خطا، حاول مجددا";
          msg.className = "text-sm text-center text-red-500";
          msg.classList.remove("hidden");
        }
      } catch (err) {
        console.error(err);
      }
    }

    //---مشان قصة الدحول بحساب موظف ----/
    document.addEventListener("DOMContentLoaded", function () {
      var role = (localStorage.getItem("userRole") || "").toLowerCase();
      if (role === "admin") {
        var adminBtn = document.getElementById("adminBtn");
        if (adminBtn) adminBtn.classList.remove("hidden");
      }
    });
    loadUserInfo();
    loadRequests();
  </script>
</body>

</html>
