<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات | GovFive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --dark-green: #042522;
            --gold: #96835F;
            --gold-bright: #C9A227;
            --bg-page: #f7f5f0;
            --card-bg: #ffffff;
            --card-border: #e6e1d6;
            --text-main: #1c2b29;
            --text-sub: #6b6357;
        }

        * {
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-page);
        }

        .bg-noise {
            background-image: radial-gradient(circle at 20% 20%, rgba(201, 162, 39, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 60%, rgba(4, 37, 34, 0.04) 0%, transparent 45%);
        }

        .filter-pill {
            transition: all .25s ease;
            border: none;
            color: var(--text-sub);
            background: transparent;
        }

        .filter-pill.active {
            background: linear-gradient(135deg, var(--gold-bright), var(--gold));
            color: #fff;
        }

        .filter-pill:not(.active):hover {
            color: var(--gold-bright);
        }

        .notif-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            box-shadow: 0 1px 3px rgba(4, 37, 34, 0.05);
            transition: all .25s ease;
            position: relative;
            overflow: hidden;
        }

        .notif-card:hover {
            border-color: rgba(201, 162, 39, 0.5);
            box-shadow: 0 4px 10px rgba(4, 37, 34, 0.08);
            transform: translateY(-1px);
        }

        .notif-card.unread {
            border-inline-start: 3px solid var(--gold-bright);
        }

        .notif-card.unread::after {
            content: '';
            position: absolute;
            top: 14px;
            left: 14px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold-bright);
            box-shadow: 0 0 8px rgba(201, 162, 39, 0.5);
        }

        .icon-wrap {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-success {
            background: rgba(4, 37, 34, 0.08);
            color: var(--dark-green);
        }

        .icon-warning {
            background: rgba(201, 162, 39, 0.12);
            color: var(--gold-bright);
        }

        .skeleton {
            background: linear-gradient(90deg, rgba(4, 37, 34, 0.05) 25%, rgba(4, 37, 34, 0.1) 37%, rgba(4, 37, 34, 0.05) 63%);
            background-size: 400% 100%;
            animation: shimmer 1.6s ease infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0 50%;
            }
        }

        .mark-read-btn {
            color: var(--gold);
            transition: color .2s ease;
        }

        .mark-read-btn:hover {
            color: var(--gold-bright);
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--dark-green);
            border: 1px solid var(--gold-bright);
            color: #f7f5f0;
            padding: 12px 22px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: all .3s ease;
            z-index: 100;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 4px 14px rgba(4, 37, 34, 0.25);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.new-notif {
            border: 1px solid var(--gold-bright);
        }

        .ping-ring {
            animation: ping-soft 2.2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }

        @keyframes ping-soft {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }

            75%,
            100% {
                transform: scale(2.1);
                opacity: 0;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-page);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(150, 131, 95, 0.35);
            border-radius: 10px;
        }
    </style>
</head>

<body class="bg-noise min-h-screen">
    <button onclick="history.back()" style="position: absolute; top: 10px; right: 300px; font-size: 20px;">✕</button>
    <div class="max-w-2xl mx-auto px-4 py-8 md:py-12">

        <!-- Header -->
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl md:text-3xl font-bold" style="color:var(--dark-green);">الإشعارات</h1>
                <p class="text-sm mt-1" style="color:var(--text-sub);">تابع آخر التحديثات المتعلقة بطلباتك</p>
            </div>
            <div id="unreadBadge" class="hidden items-center gap-2 pe-4 ps-3 py-2 rounded-full"
                style="background:rgba(4,37,34,0.06); border:1px solid rgba(4,37,34,0.15);">
                <span class="relative flex items-center justify-center">
                    <span class="absolute inline-flex h-full w-full rounded-full opacity-60 ping-ring"
                        style="background:var(--gold-bright);"></span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        style="color:var(--dark-green); position:relative; z-index:1;">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path>
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path>
                    </svg>
                </span>
                <span id="unreadCount" class="text-sm font-bold" style="color:var(--dark-green);">0</span>
                <span class="text-xs" style="color:var(--text-sub);">غير مقروءة</span>
            </div>
        </div>

        <!-- Filters -->
        <div class="flex justify-center mb-6">
            <div class="inline-flex items-center p-1 rounded-full"
                style="background:var(--card-bg); border:1px solid var(--card-border);">
                <button data-filter="unread"
                    class="filter-pill active px-6 py-2.5 rounded-full text-sm font-bold whitespace-nowrap">غير
                    مقروءة</button>
                <button data-filter="read"
                    class="filter-pill px-6 py-2.5 rounded-full text-sm font-bold whitespace-nowrap">مقروءة</button>
            </div>
        </div>

        <!-- List -->
        <div id="notifList" class="flex flex-col gap-3"></div>

        <!-- Empty state -->
        <div id="emptyState" class="hidden flex-col items-center justify-center py-20 text-center">
            <div class="text-5xl mb-4">🔔</div>
            <p style="color:var(--dark-green);" class="font-semibold text-lg">لا يوجد إشعارات </p>
            <p style="color:var(--text-sub);" class="text-sm mt-1">سوف تظهر أي تحديثات جديدة على طلباتك</p>
        </div>

        <!-- Loading skeleton -->
        <div id="loadingState" class="flex flex-col gap-3"></div>

    </div>

    <div id="toast" class="toast"></div>

    <script>
        var API_BASE = "http://egovservices.runasp.net";
        var allNotifications = [];
        var currentFilter = "unread";
        var lastUnreadCount = 0;
        var isFirstLoad = true;
        var POLL_INTERVAL = 60000;

        function getToken() {
            return localStorage.getItem("userToken");
        }

        function showToast(msg, isNewNotif) {
            var t = document.getElementById("toast");
            t.textContent = msg;
            t.classList.add("show");
            if (isNewNotif) { t.classList.add("new-notif"); } else { t.classList.remove("new-notif"); }
            setTimeout(function () {
                t.classList.remove("show");
                t.classList.remove("new-notif");
            }, 2500);
        }

        function playNotificationSound() {
            try {
                var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var oscillator = audioCtx.createOscillator();
                var gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = "sine";
                oscillator.frequency.value = 800;
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
                console.log("تعذر تشغيل الصوت: " + e);
            }
        }

        function renderSkeleton() {
            var loading = document.getElementById("loadingState");
            var html = "";
            for (var i = 0; i < 4; i++) {
                html += '<div class="notif-card rounded-2xl p-4 flex gap-3">' +
                    '<div class="skeleton icon-wrap"></div>' +
                    '<div class="flex-1 flex flex-col gap-2">' +
                    '<div class="skeleton h-4 w-1/3 rounded"></div>' +
                    '<div class="skeleton h-3 w-full rounded"></div>' +
                    '<div class="skeleton h-3 w-1/4 rounded"></div>' +
                    '</div>' +
                    '</div>';
            }
            loading.innerHTML = html;
        }

        var arabicMonths = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];

        function timeAgo(dateStr) {
            var d = new Date(dateStr);
            var day = d.getDate();
            var month = arabicMonths[d.getMonth()];
            var year = d.getFullYear();

            var hours = d.getHours();
            var minutes = String(d.getMinutes()).padStart(2, "0");
            var period = hours >= 12 ? "م" : "ص";
            var hours12 = hours % 12;
            if (hours12 === 0) hours12 = 12;

            return day + " " + month + " " + year + "، " + hours12 + ":" + minutes + " " + period;
        }

        function iconSvg(type) {
            if (type === "Warning") {
                return '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>';
            }
            return '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>';
        }

        function updateUnreadBadge() {
            var count = allNotifications.filter(function (n) { return !n.isRead; }).length;
            var badge = document.getElementById("unreadBadge");
            var countSpan = document.getElementById("unreadCount");
            if (count > 0) {
                countSpan.textContent = count;
                badge.classList.remove("hidden");
                badge.classList.add("flex");
            } else {
                badge.classList.add("hidden");
            }
            return count;
        }

        function getFiltered() {
            if (currentFilter === "all") return allNotifications;
            if (currentFilter === "unread") return allNotifications.filter(function (n) { return !n.isRead; });
            if (currentFilter === "read") return allNotifications.filter(function (n) { return n.isRead; });
            return allNotifications.filter(function (n) { return n.notificationType === currentFilter; });
        }

        function renderList() {
            var list = document.getElementById("notifList");
            var empty = document.getElementById("emptyState");
            var filtered = getFiltered();

            if (filtered.length === 0) {
                list.innerHTML = "";
                list.classList.add("hidden");
                empty.classList.remove("hidden");
                empty.classList.add("flex");
                return;
            }
            list.classList.remove("hidden");
            empty.classList.add("hidden");
            empty.classList.remove("flex");

            var html = "";
            for (var i = 0; i < filtered.length; i++) {
                var n = filtered[i];
                var iconClass = n.notificationType === "Warning" ? "icon-warning" : "icon-success";
                var cardClass = n.isRead ? "notif-card" : "notif-card unread";

                html += '<div class="' + cardClass + ' rounded-2xl p-4 flex gap-3 cursor-pointer" data-id="' + n.id + '">';
                html += '<div class="icon-wrap ' + iconClass + '">' + iconSvg(n.notificationType) + '</div>';
                html += '<div class="flex-1 min-w-0">';
                html += '<h3 class="font-bold text-sm" style="color:var(--dark-green);">' + n.title + '</h3>';
                html += '<p class="text-sm mt-1 leading-relaxed" style="color:var(--text-sub);">' + n.message + '</p>';
                html += '<span class="text-xs mt-2 block" style="color:var(--gold);">' + timeAgo(n.createdAt) + '</span>';
                if (!n.isRead) {
                    html += '<button class="mark-read-btn text-xs font-semibold mt-2 mark-btn" data-id="' + n.id + '">تعليم كمقروء</button>';
                }
                html += '</div>';
                html += '</div>';
            }
            list.innerHTML = html;

            var markBtns = document.querySelectorAll(".mark-btn");
            for (var j = 0; j < markBtns.length; j++) {
                markBtns[j].addEventListener("click", function (e) {
                    e.stopPropagation();
                    markAsRead(this.getAttribute("data-id"));
                });
            }

            var cards = document.querySelectorAll(".notif-card");
            for (var k = 0; k < cards.length; k++) {
                cards[k].addEventListener("click", function () {
                    var id = this.getAttribute("data-id");
                    var notif = allNotifications.find(function (x) { return x.id === id; });
                    if (notif && !notif.isRead) {
                        markAsRead(id);
                    }
                });
            }
        }

        function markAsRead(id) {
            var token = getToken();
            fetch(API_BASE + "/api/Notifications/" + id + "/read", {
                method: "PATCH",
                headers: {
                    "Authorization": "Bearer " + token
                }
            })
                .then(function (res) {
                    if (!res.ok) { throw new Error("failed"); }
                    var notif = allNotifications.find(function (x) { return x.id === id; });
                    if (notif) { notif.isRead = true; }
                    lastUnreadCount = updateUnreadBadge();
                    renderList();
                })
                .catch(function () {
                    showToast("يوجد  مشكلة، حاول مرة اخرى ", false);
                });
        }

        function loadNotifications() {
            renderSkeleton();
            var token = getToken();
            fetch(API_BASE + "/api/Notifications", {
                method: "GET",
                headers: { "Authorization": "Bearer " + token }
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    document.getElementById("loadingState").innerHTML = "";
                    if (data && data.success && data.data && data.data.notifications) {
                        allNotifications = data.data.notifications;
                        lastUnreadCount = updateUnreadBadge();
                        renderList();
                        isFirstLoad = false;
                    } else {
                        showToast("لم يتم جلب الاشعارات ", false);
                    }
                })
                .catch(function () {
                    document.getElementById("loadingState").innerHTML = "";
                    showToast("يوجد مشكلة بالاتصال، تأكد من اتصال الإنترنت", false);
                });
        }

        function pollNotifications() {
            var token = getToken();
            fetch(API_BASE + "/api/Notifications", {
                method: "GET",
                headers: { "Authorization": "Bearer " + token }
            })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (data && data.success && data.data && data.data.notifications) {
                        allNotifications = data.data.notifications;
                        var newCount = updateUnreadBadge();

                        if (!isFirstLoad && newCount > lastUnreadCount) {
                            playNotificationSound();
                            showToast("لديك إشعار جديد 🔔", true);
                        }

                        lastUnreadCount = newCount;
                        renderList();
                    }
                })
                .catch(function (err) {
                    console.log("خطأ بفحص الإشعارات: " + err);
                });
        }

        var filterBtns = document.querySelectorAll(".filter-pill");
        for (var f = 0; f < filterBtns.length; f++) {
            filterBtns[f].addEventListener("click", function () {
                for (var g = 0; g < filterBtns.length; g++) { filterBtns[g].classList.remove("active"); }
                this.classList.add("active");
                currentFilter = this.getAttribute("data-filter");
                renderList();
            });
        }

        loadNotifications();
        setInterval(pollNotifications, POLL_INTERVAL);
    </script>

</body>

</html>
